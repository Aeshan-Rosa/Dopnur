<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Dopnur — a little more space to think.</title>
  <desc id="desc">An ivory and forest-green banner for the Dopnur desktop LaTeX studio, with a leaf-shaped logo and illustrated manuscript pages.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f9f8f1"/><stop offset="1" stop-color="#edf0e6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#65795a" opacity=".11"/>
    </pattern>
  </defs>
  <rect width="1600" height="460" rx="28" fill="url(#paper)"/>
  <rect x="986" width="614" height="460" fill="url(#dots)"/>
  <path d="M963 0v460" stroke="#dce2d3"/>
  <g transform="translate(76 66)">
    <rect width="58" height="58" rx="15" fill="#355a45"/>
    <path d="M34 12v22c0 7-5 11-11 11s-10-4-10-9 4-10 10-10c2 0 4 .5 6 2V12z" fill="#f8f6ed"/>
    <circle cx="23" cy="36" r="4.6" fill="#355a45"/>
    <path d="M37 18c5-5 9-6 12-6 0 5-4 10-12 11z" fill="#d9e7bd"/>
    <text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-2" fill="#355a45">dopnur<tspan fill="#96a681">.</tspan></text>
  </g>
  <text x="76" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="55" letter-spacing="-1.5" fill="#314e3c">A little more space to think.</text>
  <text x="79" y="268" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#687563">Your LaTeX studio. On your desktop. In your own rhythm.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.5" fill="#496247">
    <rect x="78" y="329" width="166" height="38" rx="19" fill="#e4eada"/><text x="99" y="353" font-size="12" letter-spacing="1">macOS + Windows</text>
    <text x="272" y="353">LOCAL PROJECTS</text><circle cx="441" cy="348" r="2.5" fill="#aab796"/>
    <text x="465" y="353">OPTIONAL AI</text><circle cx="604" cy="348" r="2.5" fill="#aab796"/>
    <text x="628" y="353">OPEN SOURCE</text>
  </g>
  <g transform="translate(1134 64) rotate(-9 120 160)">
    <rect x="-38" y="17" width="250" height="319" rx="13" fill="#dfe6d4" stroke="#ccd7bf"/>
    <path d="M-4 68h168M-4 83h168M-4 98h109" stroke="#bdcda9" stroke-width="4"/>
  </g>
  <g transform="translate(1150 60) rotate(6 126 160)">
    <rect x="4" y="7" width="256" height="326" rx="13" fill="#ced8c2" opacity=".35"/>
    <rect width="256" height="326" rx="13" fill="#fffef9" stroke="#d9dfce" stroke-width="2"/>
    <text x="128" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#91a078">THE NEXT CHAPTER</text>
    <text x="128" y="109" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#4f694c">Begin with</text>
    <text x="128" y="144" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-style="italic" fill="#91a078">a little idea.</text>
    <path d="M40 177h176M40 188h176M40 199h130" stroke="#e0e6d8" stroke-width="3"/>
    <text x="128" y="247" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#718763">E = mc²</text>
    <path d="M40 277h176M40 288h145" stroke="#e0e6d8" stroke-width="3"/>
  </g>
  <g transform="translate(1456 91)" stroke="#b79175" stroke-width="2" stroke-linecap="round">
    <path d="M0-16v32M-16 0h32M-11-11l22 22M-11 11l22-22"/>
  </g>
  <circle cx="1096" cy="365" r="6" fill="#bccca7"/>
</svg>
